name: Deploy API

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  changes:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'api/**'
              - 'deploy/config/api.json'
              - 'scripts/deploy-cloud-run.sh'
              - '.github/workflows/deploy-api.yml'

  deploy:
    name: Deploy story-api
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          REPO: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
          SERVICE: story-api
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO}/${SERVICE}"
          docker build -t "${IMAGE}:${SHA}" -t "${IMAGE}:latest" api
          docker push "${IMAGE}:${SHA}"
          docker push "${IMAGE}:latest"

      - name: Deploy to Cloud Run
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          REPO: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          chmod +x scripts/deploy-cloud-run.sh
          ./scripts/deploy-cloud-run.sh api "${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO}/story-api:${SHA}"

      - name: Resolve service URL
        id: service
        env:
          REGION: ${{ vars.GCP_REGION }}
        run: |
          URL=$(gcloud run services describe story-api --region "${REGION}" --format='value(status.url)')
          echo "url=${URL}" >> "$GITHUB_OUTPUT"

      - id: smoke_auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ steps.service.outputs.url }}

      - name: Smoke check
        run: |
          curl -fsS --retry 5 --retry-delay 5 \
            -H "Authorization: Bearer ${{ steps.smoke_auth.outputs.id_token }}" \
            "${{ steps.service.outputs.url }}/health"
          echo "API health check passed"
