# ============================================
# DEPRECATED — use GitHub Actions instead
# ============================================
# Authoritative deploy: .github/workflows/deploy-web.yml
# Retained for manual emergency builds only. Do NOT auto-trigger on push to main.

# ============================================
# Cloud Build Configuration for img2x-web
# ============================================

steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE_NAME}:${COMMIT_SHA}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE_NAME}:latest'
      - '.'
    dir: 'web'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE_NAME}'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE_NAME}:${COMMIT_SHA}'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '3000'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--set-env-vars'
      - 'STRIPE_AMOUNT_DIGITAL_CENTS=${_STRIPE_AMOUNT_DIGITAL_CENTS},STRIPE_AMOUNT_HARDCOVER_CENTS=${_STRIPE_AMOUNT_HARDCOVER_CENTS},STRIPE_AUTOMATIC_TAX=${_STRIPE_AUTOMATIC_TAX},STRIPE_PRICE_DIGITAL_ID=${_STRIPE_PRICE_DIGITAL_ID},STRIPE_PRICE_HARDCOVER_ID=${_STRIPE_PRICE_HARDCOVER_ID}'
      - '--set-secrets'
      - 'SMTP_HOST=smtp-host:latest,SMTP_PORT=smtp-port:latest,SMTP_USER=smtp-user:latest,SMTP_PASS=smtp-pass:latest,STORY_SERVICE_URL=story-service-url:latest,STORY_INVOKER_CREDENTIALS_JSON=story-invoker-credentials:latest,STRIPE_SECRET_KEY=stripe-secret-key:latest,STRIPE_WEBHOOK_SECRET=stripe-webhook-secret:latest'

substitutions:
  _REGION: 'us-central1'
  _REPO: 'img2x-repo'
  _SERVICE_NAME: 'img2x-web'
  _STRIPE_AMOUNT_DIGITAL_CENTS: '999'
  _STRIPE_AMOUNT_HARDCOVER_CENTS: '3999'
  _STRIPE_AUTOMATIC_TAX: 'true'
  _STRIPE_PRICE_DIGITAL_ID: ''
  _STRIPE_PRICE_HARDCOVER_ID: ''

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

timeout: '600s'

images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE_NAME}:${COMMIT_SHA}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE_NAME}:latest'
