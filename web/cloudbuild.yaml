# ============================================
# Cloud Build Configuration for img2x-web
# ============================================
# Triggers on push to main branch
# Builds Docker image and deploys to Cloud Run

steps:
  # Step 1: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'NEXT_PUBLIC_PADDLE_ENVIRONMENT=sandbox'
      - '--build-arg'
      - 'NEXT_PUBLIC_PADDLE_CLIENT_TOKEN'
      - '--build-arg'
      - 'NEXT_PUBLIC_PADDLE_PRICE_DIGITAL=pri_01kgbfsfghbddqsaz0t77m50qy'
      - '--build-arg'
      - 'NEXT_PUBLIC_PADDLE_PRICE_HARDCOVER=pri_01kgbfsgjxhsgab6kp453mqh0n'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE_NAME}:${COMMIT_SHA}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE_NAME}:latest'
      - '.'
    dir: 'web'
    secretEnv: ['NEXT_PUBLIC_PADDLE_CLIENT_TOKEN']

  # Step 2: Push the Docker image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE_NAME}'

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE_NAME}:${COMMIT_SHA}'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '3000'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--set-secrets'
      - 'SMTP_HOST=smtp-host:latest,SMTP_PORT=smtp-port:latest,SMTP_USER=smtp-user:latest,SMTP_PASS=smtp-pass:latest,STORY_SERVICE_URL=story-service-url:latest,STORY_INVOKER_CREDENTIALS_JSON=story-invoker-credentials:latest,PADDLE_API_KEY=paddle-api-key:latest,PADDLE_WEBHOOK_SECRET=paddle-webhook-secret:latest'

# Substitution variables (can be overridden in trigger)
substitutions:
  _REGION: 'us-central1'
  _REPO: 'img2x-repo'
  _SERVICE_NAME: 'img2x-web'

# Secrets from Secret Manager
availableSecrets:
  secretManager:
    - versionName: projects/imgstr/secrets/paddle-client-token/versions/latest
      env: 'NEXT_PUBLIC_PADDLE_CLIENT_TOKEN'

# Build options
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

# Build timeout (10 minutes)
timeout: '600s'

# Store images in Artifact Registry
images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE_NAME}:${COMMIT_SHA}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE_NAME}:latest'
