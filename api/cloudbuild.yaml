steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/img2x-repo/story-api:$COMMIT_SHA
      - .

images:
  - us-central1-docker.pkg.dev/$PROJECT_ID/img2x-repo/story-api:$COMMIT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
